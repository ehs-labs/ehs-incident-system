version: 2

# Version updates are paused. Every open-pull-requests-limit below is 0, which
# stops Dependabot raising version-update PRs while leaving this configuration
# in place. To resume, restore the limits recorded next to each entry.
#
# Security updates are not governed by this file and are unaffected by the
# limit; they are toggled in repository settings under Code security.

updates:
  # Ruby gems — core-api
  - package-ecosystem: bundler
    directory: "/core-api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused; active value was 5
    labels:
      - dependencies
      - ruby

  # Ruby gems — notifier
  - package-ecosystem: bundler
    directory: "/notifier"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused; active value was 5
    labels:
      - dependencies
      - ruby

  # Ruby gems — shared envelope gem
  - package-ecosystem: bundler
    directory: "/shared/envelope"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused; active value was 3
    labels:
      - dependencies
      - ruby

  # npm — frontend
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused; active value was 5
    labels:
      - dependencies
      - frontend
    ignore:
      # Pin @types/node to the Node LTS line. frontend runs on Node 24 LTS
      # (see frontend/Dockerfile + frontend/package.json:engines.node).
      # Mirrors the docker `node` image ignore below.
      - dependency-name: "@types/node"
        versions: ["25.x", "26.x", "27.x"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused; active value was 3
    labels:
      - dependencies
      - ci

  # Docker images — base images for our Dockerfiles
  - package-ecosystem: docker
    directory: "/core-api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused; previously unset (Dependabot default 5)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/notifier"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused; previously unset (Dependabot default 5)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # paused; previously unset (Dependabot default 5)
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        versions: ["26.x", "27.x"]
